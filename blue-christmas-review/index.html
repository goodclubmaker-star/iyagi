<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우울폭주 성탄절 리뷰</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif}.wrap{max-width:1400px;margin:auto;padding:16px}header{position:sticky;top:0;z-index:5;background:#0d0f12f2;border-bottom:1px solid #333}.top,.scenes{display:flex;gap:7px;overflow:auto;padding:9px 0}button{border:1px solid #444;background:#242832;color:#fff;padding:9px 12px;border-radius:9px;white-space:nowrap}button.active{background:#eee;color:#111}.scene{display:none}.scene.active{display:block}.script{background:#171a20;border:1px solid #30343d;border-radius:13px;padding:16px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}.cut{background:#171a20;border:1px solid #30343d;border-radius:13px;padding:14px;min-height:210px}.vote{display:flex;gap:6px;margin:12px 0}.vote button[data-v=OK]{color:#7ee787}.vote button[data-v=KEEP]{color:#f2cc60}.vote button[data-v=NG]{color:#ff7b72}.vote button.sel{outline:2px solid currentColor}textarea{width:100%;min-height:72px;background:#0f1115;color:#fff;border:1px solid #3a3e48;border-radius:8px;padding:9px}.placeholder{height:105px;border:1px dashed #454b57;border-radius:9px;display:grid;place-items:center;color:#78808e}a{color:#8bc0ff;text-decoration:none}.status{color:#9ca4b2;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><b>憂鬱 暴注 聖誕節 · REVIEW</b><div class="top"><button id="sceneMode" class="active" onclick="setMode('scene')">씬별 보기</button><button id="cutMode" onclick="setMode('cut')">컷별 보기</button><a href="https://www.youtube.com/results?search_query=Yoshikazu+Mera+Je+te+veux" target="_blank"><button>♪ Je te veux</button></a></div><div class="scenes" id="sceneNav"></div><div class="status">OK / KEEP / NG와 메모는 현재 브라우저에 자동 저장됩니다.</div></div></header><main class="wrap" id="app"></main><script>const points={1:'서울 옥상. 산타와 루돌프가 도시로 내려오기 전. 어둡고 차가운 시작.',2:'별이 화면으로 돌진해 제목으로 변하는 타이틀.',3:'백화점 앞 크리스마스 거리. 루돌프의 이야기 시작.',4:'서울의 속도와 방향감각 상실. 빠른 몽타주.',5:'지하철 입구 노점. 혁·산타, 지민의 첫 등장.',6:'낙산 높은 언덕. 혁의 옆에서 산타가 자기 별 이야기를 한다.',7:'혁의 장삿손짓을 산타만 꿀벌의 춤으로 본다.',8:'추격과 골목. 질주→급회전→파괴→정적.',9:'높은 곳의 서울 야경. 혁의 꿈은 서울을 사는 것.',10:'백화점 뒤편. 크리스마스가 더 우울한 사람들.',11:'S#3의 반복. 이번에는 루돌프의 시점.',12:'직원 계단. 지민과 루돌프의 첫 대면.',13:'S#5를 지민의 시점으로 반복.',14:'듣지 않는 도시. “지구인들은 남의 이야기를 들으려고 하지 않아!”',15:'잠수교. 들으려 하지만 자동차 소음 때문에 들리지 않는다.',16:'잠수교 안쪽. 처음으로 서로의 이야기를 제대로 듣는다.',17:'2026 서울. 원경→회전→극클로즈업→원경의 감각적 몽타주.',18:'놀이터. 사랑의 유효기간과 기록 매체의 시간 변화.',19:'화창한 백화점 앞. 지민의 산타 알바와 파란 인형탈.',20:'백화점 뒤편. 인형탈이 혁임을 공개. 라이터와 풍선, 산타의 사라짐.',21:'혁과 지민이 나란히 앉아 이미 몇 마디 나눈 뒤의 편안한 정적.',22:'S#1의 밝은 반복. 1년 뒤 산타와 루돌프가 같은 자리에 앉아 있다.',23:'21과 연결. 미묘한 어색함·설렘·즐거움. 눈이 마주치는 1초.',24:'어린왕자 오마주. 아주 먼 서울, 풍선 하나, 작은 꿀벌의 춤, 별과 엔딩.'};let current=1,mode='scene';const nav=document.getElementById('sceneNav'),app=document.getElementById('app');for(let i=1;i<=24;i++){let b=document.createElement('button');b.textContent='S#'+String(i).padStart(2,'0');b.onclick=()=>show(i);nav.appendChild(b)}function cutCard(s,c){let id=`${s}-${c}`;return `<article class="cut"><b>CUT ${String(s).padStart(2,'0')}-${String(c).padStart(2,'0')}</b><div class="placeholder">고해상도 컷 이미지 자리</div><div class="vote"><button data-v="OK" onclick="vote(this,'${id}','OK')">OK</button><button data-v="KEEP" onclick="vote(this,'${id}','KEEP')">KEEP</button><button data-v="NG" onclick="vote(this,'${id}','NG')">NG</button></div><textarea data-id="${id}" placeholder="수정 / 살릴 점 / 뺄 점 / 추가컷 메모"></textarea></article>`}function show(n){current=n;[...nav.children].forEach((b,i)=>b.classList.toggle('active',i===n-1));let count=n===15?8:6;app.innerHTML=`<h1>S#${String(n).padStart(2,'0')}</h1><div class="script"><b>씬 포인트</b><br>${points[n]}</div><h2>${mode==='scene'?'씬 구성':'컷별 검토'}</h2><div class="grid">${Array.from({length:count},(_,i)=>cutCard(n,i+1)).join('')}</div><p><button onclick="addCut()">＋ 컷 추가</button></p>`;restore()}function setMode(m){mode=m;document.getElementById('sceneMode').classList.toggle('active',m==='scene');document.getElementById('cutMode').classList.toggle('active',m==='cut');show(current)}function vote(b,id,v){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');localStorage.setItem('vote-'+id,v)}function restore(){document.querySelectorAll('.cut').forEach(c=>{let id=c.querySelector('textarea').dataset.id,v=localStorage.getItem('vote-'+id);if(v){let b=c.querySelector(`[data-v="${v}"]`);if(b)b.classList.add('sel')}let t=c.querySelector('textarea');t.value=localStorage.getItem('memo-'+id)||'';t.oninput=()=>localStorage.setItem('memo-'+id,t.value)})}function addCut(){let g=document.querySelector('.grid'),c=g.children.length+1;g.insertAdjacentHTML('beforeend',cutCard(current,c));restore()}show(1);</script></body></html>
