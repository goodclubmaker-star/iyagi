<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우울폭주 성탄절 이미지 리뷰</title><style>*{box-sizing:border-box}body{margin:0;background:#0c0e12;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif}.wrap{max-width:1500px;margin:auto;padding:14px}header{position:sticky;top:0;z-index:10;background:#0c0e12f5;border-bottom:1px solid #333}.row,.nav{display:flex;gap:7px;overflow:auto;padding:8px 0}button,select{border:1px solid #444;background:#20242c;color:#fff;padding:9px 11px;border-radius:9px;white-space:nowrap}button.active{background:#eee;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px}.card{background:#15181e;border:1px solid #30343d;border-radius:13px;overflow:hidden}.card img{width:100%;aspect-ratio:16/10;object-fit:contain;background:#090a0d;display:block}.meta{padding:11px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.tag{font-size:12px;background:#282d37;padding:4px 7px;border-radius:999px}.ok{color:#7ee787}.muted{color:#9ca4b2;font-size:13px}.empty{padding:45px 15px;text-align:center;color:#8a93a3;border:1px dashed #444;border-radius:12px}.script{background:#15181e;border:1px solid #30343d;border-radius:12px;padding:13px;margin-bottom:13px;line-height:1.6}input[type=checkbox]{transform:scale(1.25)}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><b>憂鬱 暴注 聖誕節 · IMAGE LIBRARY</b><div class="row"><button onclick="view='all';render()">전체</button><button onclick="view='bible';render()">설정집</button><button onclick="view='unclassified';render()">미분류</button><button onclick="view='ok';render()">OK만</button><button onclick="exportOK()">✓ OK 목록 저장</button><a href="https://www.youtube.com/results?search_query=Yoshikazu+Mera+Je+te+veux" target="_blank"><button>♪ Je te veux</button></a></div><div class="nav" id="nav"></div><div class="muted">이미지는 삭제하지 않습니다 · 씬 복수태그 가능 · 선택/태그는 이 브라우저에 저장</div></div></header><main class="wrap"><div id="summary"></div><div id="app"></div></main><script>const points={1:'서울 옥상. 산타와 루돌프가 도시로 내려오기 전.',2:'별이 화면으로 돌진해 제목으로 변하는 타이틀.',3:'백화점 앞 크리스마스 거리.',4:'서울의 속도와 방향감각 상실. 빠른 몽타주.',5:'지하철 입구 노점. 혁·산타, 지민의 첫 등장.',6:'낙산 높은 언덕.',7:'혁의 장삿손짓을 산타만 꿀벌의 춤으로 본다.',8:'추격과 골목. 질주→파괴→정적.',9:'높은 곳의 서울 야경.',10:'백화점 뒤편.',11:'S#3 반복, 루돌프 시점.',12:'직원 계단. 지민과 루돌프 첫 대면.',13:'S#5 지민 시점.',14:'듣지 않는 도시.',15:'잠수교. 자동차 소음 속 대화.',16:'잠수교 안쪽. 서로의 이야기를 듣는다.',17:'2026 서울 감각적 몽타주.',18:'놀이터. 사랑의 유효기간과 기록매체.',19:'화창한 백화점 앞. 산타 알바와 파란 인형탈.',20:'백화점 뒤편. 혁 공개, 라이터와 풍선.',21:'혁과 지민이 나란히 앉은 편안한 정적.',22:'S#1의 밝은 반복. 1년 뒤.',23:'어색함·설렘·즐거움.',24:'어린왕자 오마주 엔딩.'};const known=[{id:'s03a',title:'S#03-A 명동 신세계 앞',scene:[3],src:''},{id:'s05a',title:'S#05 지하철 앞 가판대 · 버전 A',scene:[5],src:''},{id:'s05b',title:'S#05 지하철 앞 가판대 · 버전 B',scene:[5],src:''},{id:'s08a',title:'S#08 무너진 가판대 · 버전 A',scene:[8],src:''},{id:'s08b',title:'S#08 무너진 가판대 · 버전 B',scene:[8],src:''},{id:'s12',title:'S#12 처음 만난 두 사람',scene:[12],src:''},{id:'s14',title:'S#14 듣지 않는 세상',scene:[14],src:''},{id:'s15a',title:'S#15 잠수교 · 스토리보드',scene:[15],src:''},{id:'s15b',title:'S#15 잠수교 · 측면 트래킹',scene:[15],src:''},{id:'s15c',title:'S#15 잠수교 · 로케이션/카메라 시트',scene:[15],src:''},{id:'s17',title:'S#17 연결된 도시',scene:[17],src:''},{id:'s24a',title:'S#24 엔딩 · 버전 A',scene:[24],src:''},{id:'s24b',title:'S#24 엔딩 · 버전 B',scene:[24],src:''}];let view='all',scene=0;const nav=document.getElementById('nav');for(let i=1;i<=24;i++){let b=document.createElement('button');b.textContent='S#'+String(i).padStart(2,'0');b.onclick=()=>{view='scene';scene=i;render()};nav.appendChild(b)}function scenesOf(x){let s=localStorage.getItem('tags-'+x.id);return s?s.split(',').filter(Boolean).map(Number):x.scene||[]}function isOK(x){return localStorage.getItem('ok-'+x.id)==='1'}function card(x){let tags=scenesOf(x),opts=Array.from({length:24},(_,i)=>`<option value="${i+1}">S#${String(i+1).padStart(2,'0')}</option>`).join('');return `<article class="card">${x.src?`<a href="${x.src}" target="_blank"><img src="${x.src}"></a>`:`<div class="empty">원본 이미지 연결 대기<br><small>${x.title}</small></div>`}<div class="meta"><b>${x.title}</b><div class="tags">${tags.map(t=>`<span class="tag">S#${String(t).padStart(2,'0')}</span>`).join('')||'<span class="tag">미분류</span>'}</div><label class="ok"><input type="checkbox" ${isOK(x)?'checked':''} onchange="setOK('${x.id}',this.checked)"> OK</label> &nbsp; <select onchange="addTag('${x.id}',this.value);this.selectedIndex=0"><option value="">+ 씬 태그</option>${opts}</select> <button onclick="clearTags('${x.id}')">태그 초기화</button></div></article>`}function render(){let arr=known;if(view==='scene')arr=known.filter(x=>scenesOf(x).includes(scene));if(view==='unclassified')arr=known.filter(x=>scenesOf(x).length===0);if(view==='ok')arr=known.filter(isOK);document.getElementById('summary').innerHTML=view==='scene'?`<h1>S#${String(scene).padStart(2,'0')}</h1><div class="script">${points[scene]}</div>`:`<h1>${view==='all'?'전체 이미지':view==='bible'?'설정집':view==='ok'?'OK 이미지':'미분류'}</h1>`;document.getElementById('app').innerHTML=arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:'<div class="empty">현재 이 분류에 표시할 항목이 없습니다.</div>'}function setOK(id,v){localStorage.setItem('ok-'+id,v?'1':'0');if(view==='ok')render()}function addTag(id,v){if(!v)return;let x=known.find(a=>a.id===id),a=scenesOf(x);if(!a.includes(+v))a.push(+v);localStorage.setItem('tags-'+id,a.join(','));render()}function clearTags(id){localStorage.setItem('tags-'+id,'');render()}function exportOK(){let a=known.filter(isOK).map(x=>({title:x.title,scenes:scenesOf(x)}));let blob=new Blob([JSON.stringify(a,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download='blue-christmas-OK.json';el.click();URL.revokeObjectURL(u)}render();</script></body></html>
