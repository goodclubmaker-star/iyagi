<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우울폭주 성탄절 — 컷 리뷰</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#101114;color:#eee;margin:0}.wrap{max-width:1200px;margin:auto;padding:28px}h1{font-size:28px}.box{background:#191b20;border:1px solid #30333b;border-radius:16px;padding:24px;margin:20px 0}.pill{display:inline-block;padding:7px 12px;border-radius:999px;background:#272a32;margin-right:8px}.ok{color:#7ee787}.keep{color:#f2cc60}.ng{color:#ff7b72}.muted{color:#9da5b4;line-height:1.7}a{color:#7cb7ff}</style></head><body><div class="wrap"><h1>憂鬱 暴注 聖誕節 · 우울폭주 성탄절</h1><div class="box"><b>씬/컷 리뷰보드</b><p class="muted">고해상도 개별 컷 리뷰용 공개 페이지입니다. 현재 이미지 원본을 컷 단위로 분리·정리하는 중입니다. 각 컷은 S# / CUT 번호별로 배치하고 <span class="ok">OK</span> · <span class="keep">KEEP</span> · <span class="ng">NG</span> · 메모로 판단할 수 있도록 구성합니다.</p><span class="pill">S#01–S#24</span><span class="pill">CUT별 개별 이미지</span><span class="pill">시나리오 병기</span></div><div class="box"><b>회의 기준</b><p class="muted">OK = 최종 후보 · KEEP = 보류/수정 후보 · NG = 제외. 스토리보드 합본 이미지는 그대로 평가하지 않고 각 패널을 독립 컷으로 분리해 평가합니다.</p></div></div></body></html>
